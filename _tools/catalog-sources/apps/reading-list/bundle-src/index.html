<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ODD Reading List</title><link rel="stylesheet" href="./assets/app.css"><script defer src="./assets/app.js"></script></head><body><div class="app"><header><div class="brand"><span class="mark">⌁</span><div><small>Private queue</small><h1>ODD Reading List</h1></div></div><label class="search">⌕ <input id="search" type="search" placeholder="Search your reading queue…" aria-label="Search reading list"></label><button id="newItem" class="primary">+ Save a link</button></header><main><aside><div class="summary"><b id="total">0</b><span>links saved</span></div><nav id="filters" aria-label="Reading filters"><button class="filter active" data-filter="all">All <b>0</b></button><button class="filter" data-filter="unread">Unread <b>0</b></button><button class="filter" data-filter="reading">Reading <b>0</b></button><button class="filter" data-filter="finished">Finished <b>0</b></button><button class="filter" data-filter="archived">Archived <b>0</b></button></nav><div class="export-actions"><button id="exportJson" class="secondary">Export JSON</button><button id="exportCsv" class="secondary">Export CSV</button></div></aside><section class="content"><div class="toolbar"><div><small>YOUR PRIVATE READING QUEUE</small><h2>Keep the good tabs</h2></div><select id="sort" aria-label="Sort reading list"><option value="updated">Recently saved</option><option value="priority">Priority first</option><option value="title">Title A–Z</option><option value="date">Published date</option></select></div><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><div id="loading" class="state">Loading your reading list…</div><div id="empty" class="state" hidden><b>Your queue is clear</b><span>Save a link when you find something worth returning to.</span></div><div id="entries" class="entries"></div></section></main></div><dialog id="dialog"><form id="form"><header><div><small>READING QUEUE</small><h2 id="dialogTitle">Save a link</h2></div><button type="button" class="icon" id="close" aria-label="Close">×</button></header><div class="fields"><label>URL<input id="url" type="url" inputmode="url" placeholder="https://example.com/article" maxlength="2000" required></label><label>Title<input id="title" maxlength="140" required></label><label>Notes<textarea id="notes" maxlength="2000" rows="3"></textarea></label><label>Tags <small>(comma separated)</small><input id="tags" maxlength="240"></label><div class="two"><label>Status<select id="status"><option>unread</option><option>reading</option><option>finished</option></select></label><label>Priority<select id="priority"><option value="0">Normal</option><option value="1">High</option></select></label></div><label>Published date<input id="date" type="date"></label></div><footer><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">Save link</button></footer></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
