name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      run-plugin-check:
        description: "Run Plugin Check from a locally built package."
        required: false
        default: true
        type: boolean

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: odd/bin/check-version
      - run: odd/bin/check-plugin-metadata

  # Build the remote catalog from _tools/catalog-sources/ and enforce
  # byte-for-byte determinism, schema validity, and SHA256/size matches.
  # Also exercises the
  # builder so a broken template or missing asset is caught on PR
  # rather than at publish time.
  catalog-build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Python catalog dependencies
        run: python -m pip install --quiet -r requirements-catalog.txt
      - name: Run catalog Python guardrail tests
        run: python -m unittest discover -s tests/app-only/python -p 'test_*.py'
      - name: Install catalog smoke dependencies
        run: npm ci --no-audit --no-fund
      - name: Build catalog from _tools/catalog-sources/
        run: python3 _tools/build-catalog.py
      - name: Verify committed catalog artifacts are current
        run: git diff --exit-code -- site/catalog/v1
      - name: Require app version bumps for changed bundle bytes
        env:
          ODD_APP_VERSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: odd/bin/check-app-version-bumps
      - name: Build preview catalog for publishing guard
        run: odd/bin/build-catalog-preview
      - name: Require preview app version bumps for changed bundle bytes
        env:
          ODD_APP_VERSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          odd/bin/check-app-version-bumps
          --channel preview
          --current-registry .odd/catalog-preview/v1/registry.json
      - name: Validate catalog (determinism + schema + hashes)
        env:
          ODD_VALIDATE_REBUILD: '1'
        run: odd/bin/validate-catalog
      - name: Require a site entry for every app
        run: python3 _tools/check-app-docs.py
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Smoke every built catalog app
        run: odd/bin/smoke-catalog-apps --screenshots-dir test-results/catalog-ci
      - name: Upload catalog smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-app-smoke
          path: test-results/catalog-ci/
          if-no-files-found: warn
          retention-days: 7

  json-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Parse every JSON file
        run: |
          set -e
          # Manifests live with each bundle source in catalog-sources/.
          MANIFESTS=$(find _tools/catalog-sources -name manifest.json -type f)
          METAS=$(find _tools/catalog-sources -name meta.json -type f)
          for f in blueprint.json blueprint-dev.json blueprint-preview.json site/playground/blueprint.json site/playground/blueprint-dev.json site/playground/blueprint-preview.json $MANIFESTS $METAS; do
              echo "  $f"
              python3 -c "import json,sys; json.load(open('$f'))"
          done

  # blueprint.json is the public Playground demo entry point. We
  # enforce that it doesn't regress to CORS-fragile release URLs or
  # unpinned plugin installs — both make first-run fatals common
  # for new users. See odd/bin/validate-blueprint for the full rule
  # list.
  blueprint-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: odd/bin/validate-blueprint
      - name: Verify current WordPress and OpenStation releases
        run: odd/bin/check-upstream-versions

  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: odd/bin/check-licenses

  manifest-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned catalog validators
        run: python -m pip install --quiet -r requirements-catalog.txt
      - name: Validate fixtures and every catalog source manifest
        run: |
          set -euo pipefail
          odd/bin/validate-manifest tests/fixtures/manifests/app-ok.json
          while IFS= read -r -d '' manifest; do
            echo "validating $manifest"
            odd/bin/validate-manifest "$manifest"
          done < <(find _tools/catalog-sources/apps -name manifest.json -type f -print0)
      - name: Reject a non-app manifest (must fail)
        run: |
          cp tests/fixtures/manifests/app-ok.json /tmp/non-app.json
          sed -i 's/"type": "app"/"type": "widget"/' /tmp/non-app.json
          if odd/bin/validate-manifest /tmp/non-app.json; then
            echo "schema failed to reject a non-app manifest" >&2
            exit 1
          fi
          echo "non-app manifest was rejected as expected"
      - name: Reject relationally invalid window bounds (must fail)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("tests/fixtures/manifests/app-ok.json")
          target = Path("/tmp/invalid-window-bounds.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))
          manifest["window"]["minWidth"] = manifest["window"]["width"] + 1
          target.write_text(json.dumps(manifest), encoding="utf-8")
          PY
          if odd/bin/validate-manifest /tmp/invalid-window-bounds.json; then
            echo "validator accepted minWidth greater than width" >&2
            exit 1
          fi
          echo "relationally invalid manifest was rejected as expected"

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Build ODD Notes from maintainable source
        run: npm run build:notes
      - name: Verify committed ODD Notes bundle is current
        run: git diff --exit-code -- _tools/catalog-sources/apps/odd-notes/bundle-src/assets/js/odd-notes.min.js
      - run: npm test

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Cache composer deps
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-
      - run: composer install --no-progress --no-interaction --prefer-dist
      - run: composer phpcs

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matrix is PHP-only: wp-phpunit/wp-phpunit is locked against
        # modern WP core (it expects wp-includes/class-wpdb.php) so
        # testing against WP 6.0 here would require per-matrix
        # version juggling. install-smoke.yml already boots the
        # plugin against real, live WordPress end-to-end, so the
        # value of a WP-version matrix dimension on PHPUnit is low.
        php: ['8.1', '8.2', '8.3']
        wp: ['latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, dom
          coverage: none
          tools: composer:v2
      - name: Cache composer deps
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "mysql ready"; exit 0
            fi
            sleep 2
          done
          echo "mysql never came up"; exit 1
      - run: composer install --no-progress --no-interaction --prefer-dist
      - name: Install WordPress test scaffolding
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: |
          bash tests/php/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "$WP_VERSION"
      - run: composer phpunit

  site-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Validate site/index.html
        run: npm exec -- html-validate site/index.html
      - name: Require a site entry for every app
        run: python3 _tools/check-app-docs.py

  zip-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: odd/bin/check-apps-only
      - name: Build a reproducible release package
        run: |
          set -euo pipefail
          odd/bin/build-zip
          first_sha256="$(sha256sum dist/odd.zip | awk '{print $1}')"
          odd/bin/build-zip
          second_sha256="$(sha256sum dist/odd.zip | awk '{print $1}')"
          test "$first_sha256" = "$second_sha256"
          (
            cd dist
            sha256sum --check odd.zip.sha256
          )
      - run: odd/bin/check-zip-contents --list
      - uses: actions/upload-artifact@v7
        with:
          name: odd-zip
          path: |
            dist/odd.zip
            dist/odd.zip.sha256
          if-no-files-found: error
          retention-days: 14

  plugin-check:
    # Reusable workflows inherit the caller's event name. The ref-type check
    # keeps direct PR/main CI covered while allowing the tagged release caller
    # to disable this source-built copy in favor of its exact-artifact gate.
    if: ${{ inputs['run-plugin-check'] || github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build release package
        run: odd/bin/build-zip
      - name: Validate release package contents
        run: odd/bin/check-zip-contents
      - name: Expand release package for Plugin Check
        run: |
          set -e
          rm -rf dist/plugin
          mkdir -p dist/plugin
          unzip -q dist/odd.zip -d dist/plugin
      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: './dist/plugin/odd'
          slug: 'odd-outlandish-desktop-decorator'
