name: e2e

# Browser-level release gate for the Apps-only ODD Shop and native ODD Notes.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_CLI_ALLOW_ROOT: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, zip, dom, gd
          coverage: none
          tools: wp-cli

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies and build the fixture catalog
        env:
          ODD_CATALOG_BASE_URL: https://fixture.invalid/catalog/v1
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --quiet -r requirements-catalog.txt
          python3 _tools/build-catalog.py

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium --with-deps; then
              exit 0
            fi
            sleep $(( attempt * 20 ))
          done
          exit 1

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -proot --silent && exit 0
            sleep 2
          done
          exit 1

      - name: Provision WordPress and fixture catalog
        working-directory: /tmp
        run: |
          mkdir -p /tmp/wp
          cd /tmp/wp
          wp core download
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp config set ODD_SMOKE_FIXTURE_ROOT /tmp/wp/wp-content/odd-smoke-fixture
          wp config set ODD_SMOKE_CATALOG_URL https://fixture.invalid/catalog/v1/registry.json
          wp core install --url=http://127.0.0.1:8080 --title=ODD-e2e --admin_user=admin --admin_password=password --admin_email=e2e@example.com --skip-email
          mkdir -p wp-content/odd-smoke-fixture wp-content/mu-plugins
          cp -R "$GITHUB_WORKSPACE/site/catalog/v1/." wp-content/odd-smoke-fixture/
          cp "$GITHUB_WORKSPACE/ci/smoke/odd-smoke-fixture.php" wp-content/mu-plugins/

      - name: Install OpenStation 1.1.0 and ODD
        working-directory: /tmp/wp
        run: |
          wp plugin install https://downloads.wordpress.org/plugin/desktop-mode.1.1.0.zip --activate
          ln -s "${{ github.workspace }}/odd" wp-content/plugins/odd
          wp plugin activate odd
          wp user meta update 1 desktop_mode_mode 1
          wp option update permalink_structure '/%postname%/'
          wp rewrite flush --hard

      - name: Install ODD Notes from the fixture catalog
        working-directory: /tmp/wp
        run: |
          wp --user=1 eval '$registry = oddout_catalog_refresh(); $entry = null; foreach ( $registry["bundles"] as $row ) { if ( "odd-notes" === $row["slug"] ) { $entry = $row; break; } } if ( ! $entry ) { fwrite( STDERR, "ODD Notes missing from catalog\n" ); exit( 1 ); } $result = oddout_catalog_install_entry( $entry ); if ( is_wp_error( $result ) ) { fwrite( STDERR, $result->get_error_message() . "\n" ); exit( 1 ); }'
          wp --user=1 eval 'exit( null !== openstation_native_window_registry( "odd-app-odd-notes" ) ? 0 : 1 );'

      - name: Start WordPress
        working-directory: /tmp/wp
        run: |
          nohup wp server --host=127.0.0.1 --port=8080 > /tmp/wp-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/wp-server.log || true
          exit 1

      - name: Run Playwright e2e
        env:
          BASE_URL: http://127.0.0.1:8080
          WP_ADMIN_USER: admin
          WP_ADMIN_PASS: password
        run: npx playwright test e2e/panel.spec.ts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
