name: install-smoke

# Hermetic release gate for the Apps-only ODD runtime and ODD Notes.
on:
  workflow_call:
    inputs:
      zip-path:
        description: "Path to odd.zip (relative to repo root)."
        required: false
        default: "dist/odd.zip"
        type: string
  workflow_dispatch:

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_CLI_ALLOW_ROOT: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, dom, gd, mbstring, xml, intl
          coverage: none
          tools: wp-cli

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python catalog dependencies
        run: python -m pip install --quiet -r requirements-catalog.txt

      - name: Build Apps-only catalog and plugin package
        env:
          ODD_CATALOG_BASE_URL: https://fixture.invalid/catalog/v1
        run: |
          python3 _tools/build-catalog.py
          odd/bin/validate-catalog
          if [ ! -f "${{ inputs.zip-path }}" ]; then odd/bin/build-zip; fi
          odd/bin/check-zip-contents "${{ inputs.zip-path }}"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -proot --silent && exit 0
            sleep 2
          done
          exit 1

      - name: Install WordPress
        run: |
          mkdir -p /tmp/wp
          cd /tmp/wp
          wp core download --locale=en_US --version=latest
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --dbprefix=odd_
          wp config set ODD_SMOKE_FIXTURE_ROOT /tmp/wp/wp-content/odd-smoke-fixture
          wp config set ODD_SMOKE_CATALOG_URL https://fixture.invalid/catalog/v1/registry.json
          wp core install --url=http://localhost --title="ODD Smoke" --admin_user=smoke --admin_password=smoke --admin_email=smoke@example.com --skip-email

      - name: Stage catalog fixture
        run: |
          mkdir -p /tmp/wp/wp-content/odd-smoke-fixture /tmp/wp/wp-content/mu-plugins
          cp -R site/catalog/v1/. /tmp/wp/wp-content/odd-smoke-fixture/
          cp ci/smoke/odd-smoke-fixture.php /tmp/wp/wp-content/mu-plugins/

      - name: Install OpenStation 1.1.0 and ODD
        env:
          ODD_ZIP: ${{ github.workspace }}/${{ inputs.zip-path }}
        working-directory: /tmp/wp
        run: |
          wp plugin install https://downloads.wordpress.org/plugin/desktop-mode.1.1.0.zip --activate
          wp plugin install "$ODD_ZIP" --activate
          wp user meta update 1 desktop_mode_mode 1

      - name: Assert Apps-only OpenStation registration
        working-directory: /tmp/wp
        run: |
          wp --user=1 eval 'exit( oddout_openstation_available() ? 0 : 1 );'
          wp --user=1 eval 'exit( null !== openstation_native_window_registry( "odd" ) ? 0 : 1 );'
          wp --user=1 eval 'exit( array( "app" ) === oddout_catalog_allowed_types() ? 0 : 1 );'
          wp --user=1 eval 'exit( function_exists( "oddout_wallpaper_scenes" ) || function_exists( "oddout_icons_get_sets" ) || function_exists( "oddout_cursors_get_sets" ) ? 1 : 0 );'

      - name: Install ODD Notes from the fixture catalog
        working-directory: /tmp/wp
        run: |
          wp --user=1 eval '$registry = oddout_catalog_refresh(); $entry = null; foreach ( $registry["bundles"] as $row ) { if ( "odd-notes" === $row["slug"] ) { $entry = $row; break; } } if ( ! $entry ) { fwrite( STDERR, "ODD Notes missing from catalog\n" ); exit( 1 ); } $result = oddout_catalog_install_entry( $entry ); if ( is_wp_error( $result ) ) { fwrite( STDERR, $result->get_error_message() . "\n" ); exit( 1 ); }'

      - name: Assert ODD Notes native app and REST API
        working-directory: /tmp/wp
        run: |
          wp --user=1 eval '$row = openstation_native_window_registry( "odd-app-odd-notes" ); exit( is_array( $row ) && "ODD Notes" === $row["title"] ? 0 : 1 );'
          wp --user=1 eval 'exit( wp_script_is( "odd-app-odd-notes", "registered" ) && wp_style_is( "odd-app-odd-notes", "registered" ) ? 0 : 1 );'
          wp --user=1 eval '$server = rest_get_server(); do_action( "rest_api_init" ); $routes = $server->get_routes(); exit( isset( $routes["/odd-notes/v1/notes"] ) ? 0 : 1 );'
          wp --user=1 eval '$apps = oddout_apps_list(); exit( 1 === count( $apps ) && "odd-notes" === $apps[0]["slug"] ? 0 : 1 );'

      - name: Fail on PHP fatals
        if: always()
        run: |
          if [ -f /tmp/wp/wp-content/debug.log ]; then
            cat /tmp/wp/wp-content/debug.log
            ! grep -E "PHP (Fatal error|Parse error)" /tmp/wp/wp-content/debug.log
          fi
